# Sub-action: mac-testflight-internal — MAS Stage 1
# Signs via Fastlane Match (openMF/ios-provisioning-profile), exactly like the iOS
# ladder — NOT a manual .p12 keychain import. The mac Distribution + Mac Installer
# Distribution certs are Match-managed (OpenSSL-encrypted); this action only provides
# MATCH_PASSWORD + MATCH_GIT_PRIVATE_KEY (+ the ASC API key) and runs the mac lane,
# which fetches + installs the certs via `match … platform:macos readonly:true`.
name: 'KMP Publish Apple — Mac TestFlight Internal (MAS Stage 1)'
description: 'Build, sign (Fastlane Match), and upload macOS app to TestFlight.'
author: 'Mifos Initiative'
branding: { icon: 'upload', color: 'blue' }

inputs:
  desktop_package_name:  { required: true,  description: 'Desktop module name' }
  appstore_key_id:       { required: true,  description: 'ASC API key ID' }
  appstore_issuer_id:    { required: true,  description: 'ASC issuer ID' }
  appstore_auth_key:     { required: true,  description: 'Base64 .p8 App Store Connect API key' }
  match_password:        { required: true,  description: 'Fastlane Match passphrase' }
  match_git_private_key: { required: false, description: 'Base64 SSH key with read access to the Match cert repo' }
  fastlane_cwd:          { required: false, default: '.', description: 'Working dir for fastlane' }

runs:
  using: 'composite'
  steps:
    - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f  # v1.232.0
      with: { bundler-cache: true }

    - name: Materialize ASC API key
      shell: bash
      working-directory: ${{ inputs.fastlane_cwd }}
      env:
        APPSTORE_AUTH_KEY_B64: ${{ inputs.appstore_auth_key }}
      run: |
        set -euo pipefail
        mkdir -p secrets
        echo "$APPSTORE_AUTH_KEY_B64" | base64 --decode > secrets/AuthKey.p8

    - name: Build + sign (Match) + upload to TestFlight
      shell: bash
      working-directory: ${{ inputs.fastlane_cwd }}
      env:
        APPSTORE_KEY_ID:       ${{ inputs.appstore_key_id }}
        APPSTORE_ISSUER_ID:    ${{ inputs.appstore_issuer_id }}
        MATCH_PASSWORD:        ${{ inputs.match_password }}
        MATCH_GIT_PRIVATE_KEY: ${{ inputs.match_git_private_key }}
      run: bundle exec fastlane mac desktop_testflight

    - name: Cleanup
      if: always()
      shell: bash
      working-directory: ${{ inputs.fastlane_cwd }}
      run: rm -rf secrets
