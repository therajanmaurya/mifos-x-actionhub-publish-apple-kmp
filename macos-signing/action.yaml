# Composite action: macOS signing via Fastlane Match + Fastlane deploy
#
# Mirrors ios-testflight-internal exactly (setup-ruby with working-directory so the
# deployment/ Gemfile's fastlane is installed; standard + pre-materialized mode
# branches). macOS certs are Match-managed (openMF/ios-provisioning-profile,
# OpenSSL-encrypted) — the mac fastlane lane fetches them via
# `match … platform:macos readonly:true`. NO manual .p12 import (those secrets are
# Match-encrypted, not plain p12s → `security import` "Unknown format").
name: 'macOS Signing (Fastlane Match) + Fastlane'
description: 'Sign the macOS app via Fastlane Match and run a Fastlane mac lane (TestFlight / App Store).'

inputs:
  desktop_package_name:  { required: false, default: 'cmp-desktop', description: 'macOS (cmp-desktop) module name' }
  fastlane_lane:         { required: false, default: 'desktop_testflight', description: 'Fastlane mac lane to run' }
  mode:                  { required: false, default: 'standard', description: "'standard' or 'pre-materialized'" }
  fastlane_cwd:          { required: false, default: '.',       description: 'Working dir for fastlane' }
  appstore_key_id:       { required: false, default: '', description: 'Ignored when mode=pre-materialized.' }
  appstore_issuer_id:    { required: false, default: '', description: 'Ignored when mode=pre-materialized.' }
  appstore_auth_key:     { required: false, default: '', description: 'Ignored when mode=pre-materialized.' }
  match_password:        { required: false, default: '', description: 'Fastlane Match passphrase. Ignored when mode=pre-materialized.' }
  match_git_private_key: { required: false, default: '', description: 'Base64 SSH key for the Match cert repo. Ignored when mode=pre-materialized.' }
  flavor:                { required: false, default: '', description: 'Product flavor threaded into the mac lane (empty → prod).' }
  build_type:            { required: false, default: '', description: 'Build type threaded into the mac lane.' }
  # ── Deprecated / no-op (retained for back-compat; macOS now signs via Match) ──
  mac_signing_certificate:             { required: false, default: '', description: 'DEPRECATED — unused (Match).' }
  mac_signing_certificate_password:    { required: false, default: '', description: 'DEPRECATED — unused (Match).' }
  mac_installer_certificate:           { required: false, default: '', description: 'DEPRECATED — unused (Match).' }
  mac_installer_certificate_password:  { required: false, default: '', description: 'DEPRECATED — unused (Match).' }
  mac_provisioning_profile_base64:     { required: false, default: '', description: 'DEPRECATED — unused (Match).' }
  keychain_password:                   { required: false, default: '', description: 'DEPRECATED — unused (Match).' }

runs:
  using: 'composite'
  steps:
    - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f  # v1.232.0
      with:
        bundler-cache: true
        working-directory: ${{ inputs.fastlane_cwd }}

    # ─── STANDARD MODE ─────────────────────────────────────────────────────
    - name: Materialize Apple secrets (standard mode)
      if: ${{ inputs.mode == 'standard' }}
      shell: bash
      env:
        APPSTORE_AUTH_KEY_B64: ${{ inputs.appstore_auth_key }}
        MATCH_GIT_PRIVATE_KEY: ${{ inputs.match_git_private_key }}
      run: bash "$GITHUB_ACTION_PATH/../_shared/scripts/materialize-apple-secrets.sh"

    - name: Build + sign (Match) + upload via Fastlane mac lane (standard mode)
      if: ${{ inputs.mode == 'standard' }}
      shell: bash
      working-directory: ${{ inputs.fastlane_cwd }}
      env:
        MATCH_PASSWORD:     ${{ inputs.match_password }}
        APPSTORE_KEY_ID:    ${{ inputs.appstore_key_id }}
        APPSTORE_ISSUER_ID: ${{ inputs.appstore_issuer_id }}
        FLAVOR:             ${{ inputs.flavor }}
        BUILD_TYPE:         ${{ inputs.build_type }}
      run: |
        ARGS=""
        [ -n "$FLAVOR" ]     && ARGS="$ARGS flavor:$FLAVOR"
        [ -n "$BUILD_TYPE" ] && ARGS="$ARGS build_type:$BUILD_TYPE"
        bundle exec fastlane mac ${{ inputs.fastlane_lane }} $ARGS

    - name: Cleanup (standard mode)
      if: ${{ always() && inputs.mode == 'standard' }}
      shell: bash
      run: rm -rf secrets

    # ─── PRE-MATERIALIZED MODE ─────────────────────────────────────────────
    - name: Build + sign (Match) + upload via Fastlane mac lane (pre-materialized mode)
      if: ${{ inputs.mode == 'pre-materialized' }}
      shell: bash
      working-directory: ${{ inputs.fastlane_cwd }}
      env:
        FLAVOR:     ${{ inputs.flavor }}
        BUILD_TYPE: ${{ inputs.build_type }}
      run: |
        ARGS=""
        [ -n "$FLAVOR" ]     && ARGS="$ARGS flavor:$FLAVOR"
        [ -n "$BUILD_TYPE" ] && ARGS="$ARGS build_type:$BUILD_TYPE"
        bundle exec fastlane mac ${{ inputs.fastlane_lane }} $ARGS
