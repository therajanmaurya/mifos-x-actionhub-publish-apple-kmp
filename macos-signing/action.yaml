# Composite action: macOS signing via Fastlane Match + Fastlane deploy
#
# macOS certs are managed by Fastlane Match (openMF/ios-provisioning-profile,
# OpenSSL-encrypted) — exactly like iOS. This composite provides MATCH_PASSWORD +
# MATCH_GIT_PRIVATE_KEY (+ the ASC API key) and runs the requested Fastlane mac
# lane, which fetches + installs the Apple Distribution + Mac Installer
# Distribution certs via `match … platform:macos readonly:true`.
#
# Previously this did a MANUAL .p12 keychain import from base64 secrets, but those
# secrets are Match-encrypted (not plain p12s), so `security import` rejected them
# with "Unknown format in import". The mac_*_certificate* / keychain_password inputs
# are retained as optional/no-op for back-compat with callers that still pass them.
name: 'macOS Signing (Fastlane Match) + Fastlane'
description: 'Sign the macOS app via Fastlane Match and run a Fastlane mac lane (TestFlight / App Store).'

inputs:
  desktop_package_name:
    description: 'macOS (cmp-desktop) module name'
    required: false
    default: 'cmp-desktop'
  fastlane_lane:
    description: 'Fastlane mac lane to run (desktop_testflight | desktop_beta | desktop_release)'
    required: false
    default: 'desktop_testflight'
  fastlane_cwd:
    description: 'Working dir for fastlane'
    required: false
    default: '.'
  appstore_key_id:
    description: 'App Store Connect API key ID'
    required: false
  appstore_issuer_id:
    description: 'App Store Connect issuer ID'
    required: false
  appstore_auth_key:
    description: 'Base64 .p8 App Store Connect API key'
    required: false
  match_password:
    description: 'Fastlane Match passphrase'
    required: false
  match_git_private_key:
    description: 'Base64 SSH key with read access to the Match cert repo'
    required: false
  # ── Deprecated / no-op (retained for back-compat; macOS now signs via Match) ──
  mac_signing_certificate:             { required: false, description: 'DEPRECATED — unused (Match).' }
  mac_signing_certificate_password:    { required: false, description: 'DEPRECATED — unused (Match).' }
  mac_installer_certificate:           { required: false, description: 'DEPRECATED — unused (Match).' }
  mac_installer_certificate_password:  { required: false, description: 'DEPRECATED — unused (Match).' }
  mac_provisioning_profile_base64:     { required: false, description: 'DEPRECATED — unused (Match).' }
  keychain_password:                   { required: false, description: 'DEPRECATED — unused (Match).' }

runs:
  using: 'composite'
  steps:
    - name: Setup Ruby (SHA-pinned)
      uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f  # v1.232.0
      with:
        bundler-cache: true

    - name: Materialize ASC API key
      shell: bash
      working-directory: ${{ inputs.fastlane_cwd }}
      env:
        APPSTORE_AUTH_KEY_B64: ${{ inputs.appstore_auth_key }}
      run: |
        set -euo pipefail
        if [ -n "$APPSTORE_AUTH_KEY_B64" ]; then
          mkdir -p secrets
          echo "$APPSTORE_AUTH_KEY_B64" | base64 --decode > secrets/AuthKey.p8
        fi

    - name: Build + sign (Fastlane Match) + upload via Fastlane mac lane
      shell: bash
      working-directory: ${{ inputs.fastlane_cwd }}
      env:
        APPSTORE_KEY_ID:       ${{ inputs.appstore_key_id }}
        APPSTORE_ISSUER_ID:    ${{ inputs.appstore_issuer_id }}
        MATCH_PASSWORD:        ${{ inputs.match_password }}
        MATCH_GIT_PRIVATE_KEY: ${{ inputs.match_git_private_key }}
      run: bundle exec fastlane mac ${{ inputs.fastlane_lane }}

    - name: Cleanup transient secrets
      shell: bash
      if: always()
      working-directory: ${{ inputs.fastlane_cwd }}
      run: rm -f secrets/AuthKey.p8 || true
